name: Analisis ZAP y SonarQube
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrancar aplicación para análisis
        run: |
          docker build -t donantes-zap .
          docker run -d --name donantes -p 127.0.0.1:5000:5000 -e SECRET_KEY="$(openssl rand -hex 32)" donantes-zap
          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:5000/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: ZAP baseline de superficie pública
        run: |
          mkdir -p reportes-zap
          chmod 777 reportes-zap
          docker run --rm --network host -v "$PWD/reportes-zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://127.0.0.1:5000/app -r zap.html -J zap.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-zap
          path: reportes-zap/
      - if: always()
        run: docker rm -f donantes || true
  sonar:
    if: vars.SONAR_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest --cov=app --cov=validation --cov=donations --cov-report=xml:evidencias/coverage.xml
      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

